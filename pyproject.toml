[project]
name = "docuhand"
version = "0.1.0"
description = "Give your AI agent hands to operate real Word & WPS documents on Windows — an MCP server driving real Office apps via COM."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # MCP SDK: stay on 1.x — 2.x removed streamablehttp_client, which broke
    # HTTP MCP clients.
    "mcp>=1.2,<2",
    # OLE2 compound-file reader — used for the pre-COM encryption sniff.
    "olefile>=0.47",
    # pywin32: pinned <312 — 312+ broke MCP tool discovery in one of the
    # venvs tested; 311 is fine for COM automation.
    "pywin32>=306,<312",
]

[project.scripts]
docuhand = "docuhand.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docuhand"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A poisoned global PYTHONPATH (some dev boxes inject another venv) makes
# a foreign venv's packages shadow our own via sys.path; tests/conftest.py
# scrubs env + sys.path before any test imports mcp. The `com` marker keeps
# COM integration tests out of the default run (`-m com` opts in).
addopts = '-m "not com"'
markers = [
    "com: integration tests that drive real Word/WPS via COM (run locally with -m com, never in CI)",
]
