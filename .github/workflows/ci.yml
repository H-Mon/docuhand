name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the product's only platform: the dependency set includes
    # pywin32 (Windows-only wheels — an ubuntu runner cannot even `uv sync`,
    # which is why every ubuntu run on 2026-09-12 failed) and the tools under
    # test drive Word/WPS via COM. Unit tests exercise pure logic; COM
    # integration tests (`-m com`) drive real engines and stay on the
    # maintainer's machine (docs/pitfalls.md).
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: uv run pytest tests/unit -q
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --with twine python -m twine check dist/*
