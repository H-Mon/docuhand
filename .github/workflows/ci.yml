name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Unit tests are pure logic (zero COM) and run anywhere.
    # COM integration tests (`-m com`) drive real Word/WPS and run only on
    # the maintainer's Windows machine — see docs/pitfalls.md for why they
    # cannot live in CI (no Office, and the engine behaviors under test are
    # exactly the ones CI cannot reproduce).
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: uv run pytest tests/unit -q
      - name: Build distributions
        run: uv build
      - name: Check distributions
        run: uv run --with twine python -m twine check dist/*
